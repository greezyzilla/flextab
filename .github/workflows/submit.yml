name: Submit to Web Store
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chrome-web-store-submit
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      api-url: ${{ vars.PLASMO_PUBLIC_API_URL }}
      api-host: ${{ vars.PLASMO_PUBLIC_API_HOST }}

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: chrome-mv3-prod
          path: build
      - name: Publish the verified ZIP
        uses: PlasmoHQ/bpp@c15984c0a74f452851c605cab46f34d9fd6cb158 # v3.8.0
        with:
          keys: ${{ secrets.SUBMIT_KEYS }}
          artifact: build/chrome-mv3-prod.zip
