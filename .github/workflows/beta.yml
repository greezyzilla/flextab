# FlexTab Beta releases (TASK-118), for the internal testers. A beta is cut by
# pushing a tag made by `npm run release:beta` on dev (beta-vX.Y.Z.N: the last
# stable version plus the commits since it). Every push of such a tag:
#   1. validate: refuses a wrong format, a commit not on dev, or a version not
#      above every earlier beta, before anything is built;
#   2. verify:   the full verification, then the Chrome and Firefox beta builds;
#   3. publish:  a GitHub pre-release with the Chrome zip and the AMO-signed
#      (unlisted) Firefox .xpi; the FlexTab Beta Web Store item gets the upload
#      (live for testers once approved); updates.json on the permanent
#      firefox-beta release is replaced so installed Firefox Beta copies update.
# A store step without its secrets is skipped with a notice.
name: Beta release
on:
  push:
    tags: ['beta-v*']

permissions:
  contents: read

concurrency:
  group: beta-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: The tag may be released
        run: |
          git fetch --no-tags origin dev:refs/remotes/origin/dev
          node scripts/check-beta-tag.mjs "$GITHUB_REF_NAME"

  verify:
    needs: validate
    uses: ./.github/workflows/verify.yml
    with:
      api-url: ${{ vars.PLASMO_PUBLIC_API_URL }}
      api-host: ${{ vars.PLASMO_PUBLIC_API_HOST }}
      browser: true
      beta-tag: ${{ github.ref_name }}

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      CWS_CONFIGURED: ${{ secrets.CWS_REFRESH_TOKEN != '' && secrets.CWS_BETA_ITEM_ID != '' }}
      AMO_CONFIGURED: ${{ secrets.AMO_JWT_ISSUER != '' && secrets.AMO_JWT_SECRET != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: beta-builds
          path: build
      - name: GitHub pre-release with the Chrome zip
        run: |
          version="${TAG#beta-v}"   # format already checked by the validate job
          echo "VERSION=$version" >> "$GITHUB_ENV"
          cp build/chrome-mv3-beta.zip "flextab-beta-$version-chrome.zip"
          gh release create "$TAG" --prerelease --verify-tag --title "FlexTab Beta $version" \
            --notes "FlexTab Beta $version for internal testers. Firefox: install the .xpi below once; it updates itself." \
            "flextab-beta-$version-chrome.zip"
      - name: Chrome Web Store, FlexTab Beta item (live for testers once approved)
        if: env.CWS_CONFIGURED == 'true'
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_ITEM_ID: ${{ secrets.CWS_BETA_ITEM_ID }}
        run: node scripts/cws-publish.mjs build/chrome-mv3-beta.zip --publish=default
      - if: env.CWS_CONFIGURED != 'true'
        run: |
          echo "::notice::Chrome Web Store skipped: CWS_* / CWS_BETA_ITEM_ID secrets are not set. Upload flextab-beta-$VERSION-chrome.zip to the Beta item by hand."
      - name: Firefox Beta, signed on AMO (unlisted), and its updates.json
        if: env.AMO_CONFIGURED == 'true'
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          mkdir -p build/firefox-mv3-beta
          unzip -q build/firefox-mv3-beta.zip -d build/firefox-mv3-beta
          npm ci --prefix tools/web-ext --ignore-scripts --no-audit --no-fund
          xpi="flextab-beta-$VERSION.xpi"
          node scripts/amo-submit.mjs --tag="$TAG" --channel=unlisted --source-dir=build/firefox-mv3-beta --xpi-out="$xpi"
          gh release upload "$TAG" "$xpi"
          node scripts/firefox-updates.mjs --xpi="$xpi" --version="$VERSION" \
            --link="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$xpi" --out=updates.json
          # The fixed address installed copies read (scripts/channel.mjs BETA_UPDATE_URL).
          gh release view firefox-beta >/dev/null 2>&1 || gh release create firefox-beta --prerelease --latest=false \
            --title "Firefox Beta updates" --notes "Holds updates.json for installed FlexTab Beta copies on Firefox. Do not delete."
          gh release upload firefox-beta updates.json --clobber
      - if: env.AMO_CONFIGURED != 'true'
        run: |
          echo "::notice::AMO skipped: AMO_JWT_* secrets are not set. Firefox Beta was not signed or published."
