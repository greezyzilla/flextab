name: Verify extension
on:
  workflow_call:
    inputs:
      api-url:
        required: true
        type: string
      api-host:
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      # Fail a submit with missing repository variables before installation.
      - name: Validate build environment
        run: npm run check-env
        env:
          PLASMO_PUBLIC_API_URL: ${{ inputs.api-url }}
          PLASMO_PUBLIC_API_HOST: ${{ inputs.api-host }}
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck source, tests, and configuration
        run: npm run typecheck
      - name: Run regression tests and coverage gates
        id: coverage
        run: npm run test:coverage -- --run
      - name: Upload coverage report
        if: ${{ !cancelled() && steps.coverage.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: extension-coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 7
      - name: Build production ZIP
        run: npm run build:zip
        env:
          PLASMO_PUBLIC_API_URL: ${{ inputs.api-url }}
          PLASMO_PUBLIC_API_HOST: ${{ inputs.api-host }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chrome-mv3-prod
          path: build/chrome-mv3-prod.zip
          if-no-files-found: error
          retention-days: 7
