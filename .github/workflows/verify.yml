name: Verify extension
on:
  workflow_call:
    inputs:
      api-url:
        required: true
        type: string
      api-host:
        required: true
        type: string
      # Push and PR CI stays light (TASK-116): no browser install, jsdom tests only.
      # Release workflows pass true so the browser-mode suite runs before publishing.
      browser:
        required: false
        type: boolean
        default: false
      # The beta workflow passes the pushed beta-vX.Y.Z.N tag (TASK-118): the beta
      # builds for Chrome and Firefox are then the release, kept as artifacts.
      beta-tag:
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      # Fail a submit with missing repository variables before installation.
      - name: Validate build environment
        run: npm run check-env
        env:
          PLASMO_PUBLIC_API_URL: ${{ inputs.api-url }}
          PLASMO_PUBLIC_API_HOST: ${{ inputs.api-host }}
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install the browser for browser-mode tests
        if: ${{ inputs.browser }}
        run: npx playwright install --with-deps chromium
      - name: Typecheck source, tests, and configuration
        run: npm run typecheck
      # The coverage numbers are the same either way: the browser suite measures none of them.
      - name: Run regression tests and coverage gates
        id: coverage
        run: npm run test:coverage -- --run ${{ !inputs.browser && '--project unit' || '' }}
      - name: Upload coverage report
        if: ${{ !cancelled() && steps.coverage.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: extension-coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 7
      - name: Build production ZIP
        run: npm run build:zip -- --channel=stable
        env:
          PLASMO_PUBLIC_API_URL: ${{ inputs.api-url }}
          PLASMO_PUBLIC_API_HOST: ${{ inputs.api-host }}
      # The beta channel must build too; this fixture tag is never published.
      # The beta channel must build too; without a beta release, a fixture tag
      # that is never published.
      - name: Build the beta channel
        run: npm run build:zip -- --channel=beta --beta-tag="${BETA_TAG:-beta-v0.0.0.1}"
        env:
          BETA_TAG: ${{ inputs.beta-tag }}
          PLASMO_PUBLIC_API_URL: ${{ inputs.api-url }}
          PLASMO_PUBLIC_API_HOST: ${{ inputs.api-host }}
      - name: Build Firefox Beta and lint it as self-hosted
        if: ${{ inputs.beta-tag != '' }}
        run: |
          npm run build:zip -- --channel=beta --beta-tag="$BETA_TAG" --target=firefox-mv3
          npm ci --prefix tools/web-ext --ignore-scripts --no-audit --no-fund
          tools/web-ext/node_modules/.bin/web-ext lint --self-hosted --source-dir build/firefox-mv3-beta
          node scripts/check-permissions.mjs build/firefox-mv3-beta
        env:
          BETA_TAG: ${{ inputs.beta-tag }}
          PLASMO_PUBLIC_API_URL: ${{ inputs.api-url }}
          PLASMO_PUBLIC_API_HOST: ${{ inputs.api-host }}
      # Firefox (TASK-112): the same code built for Firefox must pass Mozilla's
      # linter. web-ext lives in tools/web-ext with its own lockfile.
      - name: Build Firefox and lint it with web-ext
        run: |
          npm run build:zip -- --channel=stable --target=firefox-mv3
          npm run lint:firefox
        env:
          PLASMO_PUBLIC_API_URL: ${{ inputs.api-url }}
          PLASMO_PUBLIC_API_HOST: ${{ inputs.api-host }}
      # TASK-115: a new required permission disables FlexTab until each user
      # accepts it. The built manifests are checked against permissions.lock.json.
      - name: No new required permission
        run: npm run check:permissions
        env:
          PLASMO_PUBLIC_API_HOST: ${{ inputs.api-host }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chrome-mv3-prod
          path: build/chrome-mv3-prod.zip
          if-no-files-found: error
          retention-days: 7
      # A release publishes exactly what was verified here (TASK-117).
      - if: ${{ inputs.browser }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firefox-mv3-prod
          path: build/firefox-mv3-prod.zip
          if-no-files-found: error
          retention-days: 7
      - if: ${{ inputs.beta-tag != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: beta-builds
          path: |
            build/chrome-mv3-beta.zip
            build/firefox-mv3-beta.zip
          if-no-files-found: error
          retention-days: 7
