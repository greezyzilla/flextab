# Dependency updates: monthly, one grouped PR per ecosystem, and only
# versions published at least 7 days ago, so a hijacked release has time to be
# caught before it reaches us (the 2026 npm worm). PRs go to dev, where work lands.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope
    open-pull-requests-limit: 1
