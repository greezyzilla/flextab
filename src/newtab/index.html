<!DOCTYPE html>
<html lang="en">
  <head>
    <title>__plasmo_static_index_title__</title>
    <meta charset="utf-8" />
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
    <!-- Puts the stored mode and look on <html> before the first paint. Its own file:
         MV3 pages run no inline scripts. Paths are relative to .plasmo/, where Plasmo writes the page. -->
    <script src="../src/boot/look.js"></script>
    <script type="module" src="../src/boot/icon.ts"></script>
  </head>
  <body>
    <!-- The shell's skeleton, filled before the first paint from the copy the app keeps
         (components/layout/ShellSkeleton.tsx), removed by the page's first commit. -->
    <div id="boot-skeleton" aria-hidden="true"></div>
    <script src="../src/boot/shell.js"></script>
  </body>
</html>
